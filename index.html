const tcol=()=>{const cs=getComputedStyle(document.documentElement);const g=k=>cs.getPropertyValue(k).trim();return{bg:g('--bg'),sf:g('--sf'),tx:g('--tx'),mu:g('--mu'),bd:g('--bd'),ac:g('--ac')}};

 rr(g,x+lw,yy+11,w-lw-70,22,11);g.fillStyle=C.sf;g.fill();rr(g,x+lw,yy+11,Math.max(22,(w-lw-70)*v/mx),22,11);g.fillStyle=C.ac;g.fill();

   <div className="flex gap-2 overflow-x-auto"><select className="!w-auto" value={t} onChange={e=>setT(e.target.value)}><option value="">모든 종류</option>{db.types.map(x=><option key={x.id} value={x.id}>{x.l}</option>)}</select>
    <Chip on={!f} onClick={()=>setF('')}>전체</Chip>{ST.map(s=><Chip key={s.k} on={f===s.k} onClick={()=>setF(s.k)}>{s.l}</Chip>)}</div></div>
  <div className="pt-3">{body}</div></div>};

/* ---- 설정 ---- */
const ACC=['#859900','#6c8f7e','#b58900','#2aa198','#268bd2','#a89f8a','#cb4b16','#d33682','#6c71c4'];
const FONTS={sys:['시스템 기본','-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif'],noto:['Noto Sans KR','"Noto Sans KR",sans-serif'],serif:['Noto Serif KR (명조)','"Noto Serif KR",serif'],plex:['IBM Plex Sans KR','"IBM Plex Sans KR",sans-serif'],dodum:['고운돋움','"Gowun Dodum",sans-serif'],mono:['고정폭','ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace']};
const Settings=({db,setDb,cfg,setCfg})=>{
 const [et,setEt]=S('');const [es,setEs]=S('');const [pend,setPend]=S(null);const [it,setIt]=S('');const [is,setIs]=S('');const [nt,setNt]=S('');const [ist,setIst]=S('');const [prog,setProg]=S(null);
 const pick=(t,s)=>db.items.filter(i=>(!t||i.type===t)&&(!s||i.status===s));
 const Sel=({v,s})=><div className="flex gap-2"><select value={v[0]} onChange={e=>v[1](e.target.value)}><option value="">모든 종류</option>{db.types.map(x=><option key={x.id} value={x.id}>{x.l}</option>)}</select>
  <select value={s[0]} onChange={e=>s[1](e.target.value)}><option value="">모든 상태</option>{ST.map(x=><option key={x.k} value={x.k}>{x.l}</option>)}</select></div>;
 const Sec=({t,children})=><section className="py-5 border-b border-bd space-y-3"><h2 className="text-sm text-mu">{t}</h2>{children}</section>;
 const file=async e=>{const f=e.target.files[0];if(!f)return;const tx=await f.text();try{const rows=f.name.endsWith('.json')?(JSON.parse(tx).items||JSON.parse(tx)):parseCSV(tx);setPend(fromRows(rows,db.types))}catch(x){alert('파일을 읽을 수 없어요')}e.target.value=''};
 const doImport=async()=>{let L=pend.filter(i=>(!it||i.type===it)&&(!is||i.status===is)).map(i=>ist?{...i,status:ist,...(ist==='done'?{finishedAt:i.finishedAt||today()}:{})}:i);
  if(L.some(i=>i.source==='letterboxd')){if(!cfg.tmdb){alert('Letterboxd는 TMDB로 조회해 가져와요. 위 검색 API에 TMDB 키를 먼저 입력하세요.');return}
   setProg({n:0,t:L.length});const out=[...L];
   const work=async k=>{const i=L[k];if(i.source==='letterboxd'){try{const q='&query='+encodeURIComponent(i.title);let h=((await tm('search/movie',cfg,q+(i.year?'&year='+i.year:''))).results||[])[0];
     if(!h&&i.year)h=((await tm('search/movie',cfg,q)).results||[])[0];
     if(h){const base={...i,title:h.title||i.title,year:(h.release_date||'').slice(0,4)||i.year,cover:h.poster_path?'https://image.tmdb.org/t/p/w342'+h.poster_path:'',extId:String(h.id),tags:gt(h.genre_ids),source:'tmdb'};let x={};try{x=await PROV.tmdb.detail(base,cfg)}catch(e){}
      out[k]={...base,...x,meta:{...base.meta,...x.meta},tags:x.tags&&x.tags.length?x.tags:base.tags,creator:x.creator||''}}else out[k]={...i,miss:1}}catch(e){out[k]={...i,miss:1}}}
    setProg(p=>({...p,n:p.n+1}))};
   let k=0;await Promise.all([...Array(4)].map(async()=>{while(k<L.length)await work(k++)}));L=out;setProg(null)}
  const key=i=>[i.type,i.title,i.year].join('|');const have=new Set();db.items.forEach(i=>{have.add(key(i));if(i.source==='tmdb')have.add('t'+i.extId)});
  const nw=[];let miss=0;L.forEach(({miss:m,...i})=>{const a=key(i),b=i.source==='tmdb'?'t'+i.extId:a;if(have.has(a)||have.has(b))return;have.add(a);have.add(b);if(m)miss++;nw.push({...i,added:Date.now()})});
  const types=[...db.types];nw.forEach(i=>{if(!types.some(x=>x.id===i.type))types.push({id:i.type,l:i.type})});
  setDb({...db,types,items:[...db.items,...nw]});alert(nw.length+'개 가져옴 (중복 '+(L.length-nw.length)+'개 제외'+(miss?', TMDB 미매칭 '+miss+'개':'')+')');setPend(null)};
 return <div>
  <Sec t="테마"><div className="flex gap-2 flex-wrap">{[['light','Solarized Light'],['dark','Solarized Dark'],['white','Paper White'],['sand','Warm Sand'],['nord','Nord'],['black','Graphite'],['auto','시스템']].map(([k,l])=><Chip key={k} on={cfg.theme===k} onClick={()=>setCfg({...cfg,theme:k})}>{l}</Chip>)}</div>
   <div className="flex gap-3 flex-wrap">{ACC.map(c=><button key={c} aria-label={c} onClick={()=>setCfg({...cfg,accent:c})} style={{background:c}} className={'w-8 h-8 rounded-full '+(cfg.accent===c?'ring-2 ring-offset-2 ring-tx ring-offset-bg':'')}/>)}</div></Sec>
  <Sec t="글자 색"><div className="flex gap-3 flex-wrap items-center">{['#073642','#111111','#2b2622','#4a4a4a','#eee8d5','#ededed','#eceff4'].map(c=><button key={c} aria-label={c} onClick={()=>setCfg({...cfg,tx:c})} style={{background:c}} className={'w-8 h-8 rounded-full border border-bd '+(cfg.tx===c?'ring-2 ring-offset-2 ring-ac ring-offset-bg':'')}/>)}
   <input type="color" aria-label="직접 선택" value={cfg.tx||'#073642'} onChange={e=>setCfg({...cfg,tx:e.target.value})} className="!w-10 !h-8 !p-0"/><Chip on={!cfg.tx} onClick={()=>setCfg({...cfg,tx:''})}>테마 기본</Chip></div></Sec>
  <Sec t="글꼴"><div className="flex gap-2 flex-wrap">{Object.entries(FONTS).map(([k,v])=><Chip key={k} on={(cfg.font||'sys')===k} onClick={()=>setCfg({...cfg,font:k})}>{v[0]}</Chip>)}</div>
   <div className="flex gap-2 flex-wrap">{[[300,'가늘게'],[400,'보통']].map(([w,l])=><Chip key={w} on={(cfg.fw||300)===w} onClick={()=>setCfg({...cfg,fw:w})}>{l}</Chip>)}</div></Sec>
  <Sec t="글자 크기"><div className="flex gap-2 flex-wrap">{[[14,'작게'],[16,'보통'],[18,'크게'],[20,'아주 크게']].map(([z,l])=><Chip key={z} on={(cfg.fsize||16)===z} onClick={()=>setCfg({...cfg,fsize:z})}>{l}</Chip>)}</div></Sec>
  <Sec t="검색 API"><input placeholder="국립중앙도서관 cert_key" value={cfg.nlk} onChange={e=>setCfg({...cfg,nlk:e.target.value})}/>
   <input placeholder="TMDB API 키 (v3)" value={cfg.tmdb} onChange={e=>setCfg({...cfg,tmdb:e.target.value})}/>
   <input placeholder="Google Books API 키 (선택, 호출량 많을 때)" value={cfg.gbooks||''} onChange={e=>setCfg({...cfg,gbooks:e.target.value})}/>
   <input placeholder="CORS 프록시 주소 (선택, 예: https://proxy.example/?url=)" value={cfg.proxy} onChange={e=>setCfg({...cfg,proxy:e.target.value})}/></Sec>
  <Sec t="내보내기"><Sel v={[et,setEt]} s={[es,setEs]}/><p className="text-sm text-mu">{pick(et,es).length}개 선택됨</p>
   <div className="flex gap-2"><button onClick={()=>dl('기록.csv',toCSV(pick(et,es)),'text/csv')} className="flex-1 py-2 rounded-lg border border-bd flex items-center justify-center gap-2"><Ic n="dl" s={16}/>CSV</button>
    <button onClick={()=>dl('기록.json',JSON.stringify({items:pick(et,es)},null,1),'application/json')} className="flex-1 py-2 rounded-lg border border-bd flex items-center justify-center gap-2"><Ic n="dl" s={16}/>JSON</button></div></Sec>
  <Sec t="가져오기"><label className="py-2 rounded-lg border border-bd flex items-center justify-center gap-2 cursor-pointer"><Ic n="ul" s={16}/>CSV / JSON / Letterboxd CSV 선택<input type="file" accept=".csv,.json" onChange={file} className="hidden"/></label>
   {pend&&<><Sel v={[it,setIt]} s={[is,setIs]}/>
    <label className="block text-xs text-mu">가져올 상태<select value={ist} onChange={e=>setIst(e.target.value)}><option value="">파일 값 유지 (Letterboxd는 완료)</option>{ST.map(x=><option key={x.k} value={x.k}>모두 {x.l}(으)로</option>)}</select></label>
    {pend.some(i=>i.source==='letterboxd')&&<p className="text-xs text-mu">Letterboxd 목록은 제목·연도로 TMDB를 조회해 표지·장르·감독 등 상세 정보를 채워 가져와요.</p>}<p className="text-sm text-mu">{pend.filter(i=>(!it||i.type===it)&&(!is||i.status===is)).length}개 가져올 예정 (같은 종류·제목·연도는 건너뜀)</p>
    <button disabled={!!prog} onClick={doImport} className="w-full py-2 rounded-lg bg-ac text-bg disabled:opacity-40">{prog?`TMDB 조회 중 ${prog.n}/${prog.t}`:'가져오기'}</button></>}</Sec>
  <Sec t="종류 관리"><div className="flex gap-2 flex-wrap">{db.types.map(x=><span key={x.id} className="px-3 py-1 rounded-full bg-sf text-sm">{x.l}</span>)}</div>
   <div className="flex gap-2"><input placeholder="새 종류 (예: 드라마)" value={nt} onChange={e=>setNt(e.target.value)}/><button disabled={!nt.trim()} onClick={()=>{setDb({...db,types:[...db.types,{id:'t'+uid(),l:nt.trim()}]});setNt('')}} className="px-3 rounded-lg bg-ac text-bg disabled:opacity-40"><Ic n="plus" s={16}/></button></div></Sec>
  <Sec t="데이터"><p className="text-sm text-mu">이 브라우저에 저장됩니다. 주기적으로 내보내기를 권장해요.</p>
   <button onClick={()=>{if(confirm('모든 기록을 삭제할까요?'))setDb({...db,items:[]})}} className="text-sm text-mu">전체 삭제</button></Sec>
 </div>};

/* ---- App ---- */
function App(){
 const [db,setDb]=S(()=>{const d=load('rec.db',{types:[{id:'book',l:'책'},{id:'movie',l:'영화'},{id:'drama',l:'드라마'}],items:[],lists:[]});if(!d.types.some(x=>x.id==='drama'))d.types=[...d.types,{id:'drama',l:'드라마'}];return d});
 const [cfg,setCfg]=S(()=>load('rec.cfg',{theme:'light',accent:'#859900',nlk:'',tmdb:'',proxy:''}));
 const [tab,setTab]=S('lib');const [sel,setSel]=S(null);const [np,setNp]=S(null);
 E(()=>{localStorage.setItem('rec.db',JSON.stringify(db))},[db]);
 E(()=>{localStorage.setItem('rec.cfg',JSON.stringify(cfg));const r=document.documentElement;
  const mq=matchMedia('(prefers-color-scheme: dark)');const ap=()=>{r.dataset.t=cfg.theme==='auto'?(mq.matches?'dark':'light'):cfg.theme;r.style.setProperty('--ac',cfg.accent);cfg.tx?r.style.setProperty('--tx',cfg.tx):r.style.removeProperty('--tx');r.style.fontSize=(cfg.fsize||16)+'px';r.style.setProperty('--ff',(FONTS[cfg.font]||FONTS.sys)[1]);r.style.setProperty('--fw',cfg.fw||300)};ap();mq.addEventListener('change',ap);return()=>mq.removeEventListener('change',ap)},[cfg]);
 const upd=(id,p)=>setDb(d=>({...d,items:d.items.map(i=>i.id===id?{...i,...p}:i)}));
 const set=(it,s)=>{const p={status:s};if(s==='playing'&&!it.startedAt)p.startedAt=today();if(s==='done'){p.finishedAt=it.finishedAt||today();if(!it.startedAt)p.startedAt=p.finishedAt}upd(it.id,p)};
 const add=o=>setDb(d=>({...d,items:[{rating:0,startedAt:'',finishedAt:'',note:'',...o,id:uid(),added:Date.now()},...d.items]}));
 const addList=(lid,iid)=>setDb(d=>({...d,lists:d.lists.map(l=>l.id===lid?{...l,body:(l.body?l.body.replace(/\n?$/,'\n'):'')+'[['+iid+']]\n'}:l)}));
 const del=id=>setDb(d=>({...d,items:d.items.filter(i=>i.id!==id)}));
 const qset=(id,p)=>setDb(d=>{const cur=d.items.find(i=>i.id===id);
  const L=d.items.filter(i=>i.q&&i.id!==id&&i.type===cur.type).sort((a,b)=>a.q.o-b.q.o);
  if(p)L.splice(p==='end'?L.length:Math.min(p-1,L.length),0,{...cur,q:{}});
  const pos=Object.fromEntries(L.map((x,n)=>[x.id,n]));
  return{...d,items:d.items.map(i=>i.id===id?(p?{...i,q:{o:pos[id]}}:{...i,q:undefined}):pos[i.id]!==undefined?{...i,q:{...i.q,o:pos[i.id]}}:i)}});
 const cur=db.items.find(i=>i.id===sel);const npi=db.items.find(i=>i.id===np);
 const ranks={};db.types.forEach(t=>db.items.filter(i=>i.q&&i.type===t.id).sort((a,b)=>a.q.o-b.q.o).forEach((i,n)=>{ranks[i.id]=n+1}));
 if(cur&&cur.status==='playing'&&!cur.startedAt)upd(cur.id,{startedAt:today()});
 const T=[['lib','라이브러리','lib'],['now','감상중','play'],['tl','타임라인','cal'],['set','설정','set']];
 return <QC.Provider value={{qset,ranks,lists:db.lists,addList,openNote:setNp,cfg}}><div className="max-w-2xl mx-auto px-4 pb-20 min-h-screen" style={{paddingTop:'env(safe-area-inset-top)'}}>
  {tab==='lib'&&<Library db={db} cfg={cfg} set={set} open={setSel} add={add} setDb={setDb}/>}
  {tab==='now'&&<Playing db={db} set={set} open={setSel}/>}
  {tab==='tl'&&<Timeline db={db} set={set} open={setSel}/>}
  {tab==='set'&&<Settings db={db} setDb={setDb} cfg={cfg} setCfg={setCfg}/>}
  {npi&&<NotePage it={npi} upd={upd} close={()=>setNp(null)}/>}
  {cur&&<Detail it={cur} set={set} upd={upd} del={del} close={()=>setSel(null)} page={id=>{setSel(null);setNp(id)}}/>}
  <nav className="fixed bottom-0 inset-x-0 bg-bg border-t border-bd z-30" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>
   <div className="max-w-2xl mx-auto grid grid-cols-4">{T.map(([k,l,i])=><button key={k} onClick={()=>setTab(k)} className={'py-1.5 flex flex-col items-center text-[10px] '+(tab===k?'text-ac':'text-mu')}><Ic n={i} s={18}/>{l}</button>)}</div></nav>
 </div></QC.Provider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
